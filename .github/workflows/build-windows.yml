name: Build NFC Master System Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'source code/**'
      - '.github/workflows/build-windows.yml'
      - 'addons/**'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: source code

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 'source code/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Master-System-v1.0.3-Windows
          path: |
            source code/dist/*.exe
            source code/dist/*.blockmap
          if-no-files-found: error
          retention-days: 30
