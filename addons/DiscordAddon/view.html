<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discord Addon</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:24px}.card{max-width:620px;margin:auto;background:#1f2937;border:1px solid #374151;border-radius:18px;padding:24px;box-shadow:0 16px 40px #0004}h1{margin:0 0 8px}p{color:#9ca3af}label{display:block;margin:16px 0 7px;color:#d1d5db}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #4b5563;background:#111827;color:white}textarea{min-height:150px;resize:vertical}.row{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#5865f2;color:white}.secondary{background:#374151;color:white}.status{margin-top:15px;color:#9ca3af;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>💬 Discord Addon</h1>
<p>Stuur de NFC-scan naar een Discord-kanaal via een webhook.</p>
<label>Discord webhook URL</label><input id="webhook" type="url" placeholder="https://discord.com/api/webhooks/...">
<label>Bericht</label><textarea id="message" placeholder="NFC-data verschijnt hier..."></textarea>
<div class="row"><button class="btn primary" onclick="sendDiscord()">🚀 Naar Discord sturen</button><button class="btn secondary" onclick="clearForm()">Wissen</button></div>
<div class="status" id="status"></div>
</div>
<script>
const params=new URLSearchParams(location.search);const payload=params.get('data')||params.get('message')||'';
if(payload)document.getElementById('message').value='📡 NFC scan ontvangen:\n'+payload;
async function sendDiscord(){
 const webhook=document.getElementById('webhook').value.trim(),message=document.getElementById('message').value.trim(),status=document.getElementById('status');
 if(!/^https:\/\/discord(?:app)?\.com\/api\/webhooks\//.test(webhook)){status.textContent='Vul een geldige Discord webhook URL in.';return;}
 if(!message){status.textContent='Vul eerst een bericht in.';return;}
 status.textContent='Versturen...';
 try{const r=await fetch(webhook,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:message,username:'NFC Master'})});if(!r.ok)throw new Error('HTTP '+r.status);status.textContent='✅ Bericht naar Discord gestuurd.';}catch(e){status.textContent='❌ Versturen mislukt: '+e.message;}
}
function clearForm(){document.getElementById('message').value='';document.getElementById('status').textContent='';}
</script>
</body>
</html>
