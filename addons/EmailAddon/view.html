<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Email Addon</title>
<style>
body{font-family:Segoe UI,Arial,sans-serif;background:#111827;color:#f9fafb;margin:0;padding:24px}.card{max-width:620px;margin:auto;background:#1f2937;border:1px solid #374151;border-radius:18px;padding:24px;box-shadow:0 16px 40px #0004}h1{margin:0 0 8px}p{color:#9ca3af}label{display:block;margin:16px 0 7px;color:#d1d5db}input,textarea{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #4b5563;background:#111827;color:white}textarea{min-height:150px;resize:vertical}.row{display:flex;gap:10px;margin-top:18px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer}.primary{background:#3b82f6;color:white}.secondary{background:#374151;color:white}.status{margin-top:15px;color:#9ca3af;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>📧 Email Addon</h1>
<p>Maak snel een e-mail van de laatst ontvangen NFC-data.</p>
<label>Ontvanger</label><input id="to" type="email" placeholder="naam@example.com">
<label>Onderwerp</label><input id="subject" value="NFC Master - NFC data">
<label>Bericht</label><textarea id="body" placeholder="NFC-data verschijnt hier..."></textarea>
<div class="row"><button class="btn primary" onclick="openMail()">✉️ E-mail openen</button><button class="btn secondary" onclick="clearForm()">Wissen</button></div>
<div class="status" id="status"></div>
</div>
<script>
const params=new URLSearchParams(location.search);
const payload=params.get('data')||params.get('message')||'';
if(payload) document.getElementById('body').value='NFC scan ontvangen:\n\n'+payload;
function openMail(){
 const to=document.getElementById('to').value.trim(),subject=document.getElementById('subject').value,body=document.getElementById('body').value;
 if(!to){document.getElementById('status').textContent='Vul eerst een ontvanger in.';return;}
 location.href='mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
 document.getElementById('status').textContent='Je standaard e-mailprogramma wordt geopend.';
}
function clearForm(){document.getElementById('body').value='';document.getElementById('status').textContent='';}
</script>
</body>
</html>
